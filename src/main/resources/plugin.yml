name: GardenEvents
version: '${project.version}'
main: com.herasgarden.gardenevents.GardenEvents
api-version: '26.2'
author: Hera's Garden
website: https://herasgarden.net
description: Claimed venues, scheduled events, tickets, and admission for The Garden SMP.
depend: [GardenCore, GardenLands]

commands:
  venue:
    description: Register and manage Garden event venues.
    usage: /venue <create|info|list|buy|admit|later|settings|setprice|setopen|setentrance|delete>
  event:
    description: Create, browse, buy tickets for, and enter Garden events.
    usage: /event <create|list|info|buy|issue|admit|later|settings|setprice|setcapacity|reschedule|cancel>

permissions:
  gardenevents.admin:
    default: op
  gardenevents.venue:
    default: true
  gardenevents.venue.create:
    default: true
  gardenevents.venue.buy:
    default: true
  gardenevents.event:
    default: true
  gardenevents.event.create:
    default: true
  gardenevents.event.buy:
    default: true
